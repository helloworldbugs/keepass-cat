name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the release pipeline (notes + zips + checks) without publishing'
        type: boolean
        default: false
      publish_stores:
        description: 'Also upload this version to the Firefox and Chrome stores'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── Chrome ──
      - name: Build Chrome (manifest)
        run: npx esno ./scripts/manifest.ts

      - name: Build Chrome (background)
        run: npx vite build --config vite.config.background.mts

      - name: Build Chrome (content)
        run: npx vite build --config vite.config.content.mts

      - name: Build Chrome (web)
        run: npx vite build

      - name: Chrome — ensure stubs
        run: |
          if [ ! -f extension/dist/popup.html ]; then
            mkdir -p extension/dist
            echo '<!DOCTYPE html><html><body style="padding:20px;font-family:sans-serif;width:300px"><p>Extension loaded. Web UI build pending.</p></body></html>' > extension/dist/popup.html
            cp extension/dist/popup.html extension/dist/options.html
          fi

      - name: Chrome — upload extension
        uses: actions/upload-artifact@v7
        with:
          name: keepass-cat-chrome
          path: extension
          retention-days: 30

      # ── Firefox ──
      - name: Firefox — clean build
        run: rm -rf extension/dist extension/manifest.json

      - name: Firefox — generate manifest
        run: TARGET=firefox npx esno ./scripts/manifest.ts

      - name: Firefox — build background
        run: TARGET=firefox npx vite build --config vite.config.background.mts

      - name: Firefox — build content
        run: TARGET=firefox npx vite build --config vite.config.content.mts

      - name: Firefox — build web
        run: TARGET=firefox npx vite build

      - name: Firefox — ensure stubs
        run: |
          if [ ! -f extension/dist/popup.html ]; then
            mkdir -p extension/dist
            echo '<!DOCTYPE html><html><body style="padding:20px;font-family:sans-serif;width:300px"><p>Extension loaded. Web UI build pending.</p></body></html>' > extension/dist/popup.html
            cp extension/dist/popup.html extension/dist/options.html
          fi

      - name: Firefox — upload extension
        uses: actions/upload-artifact@v7
        with:
          name: keepass-cat-firefox
          path: extension
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Publish, driven purely by the version in package.json.
  #
  # Pushing to main only runs this job when "v<package.json version>" does not
  # exist yet, so bumping the version is what publishes a release and any later
  # push for the same version is a no-op. The tag is created here, which is why
  # tags are never pushed by hand.
  #
  # Manually dispatching the workflow with dry_run=true runs the whole pipeline
  # (notes, zips, checks) without creating the release.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code (full history, for the changelog and tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Work out what to do for this version
        id: ver
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          dry="${{ inputs.dry_run }}"
          stores_input="${{ inputs.publish_stores }}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi

          if [ "$dry" = "true" ]; then
            run=true; publish=false
          elif [ "$tag_exists" = "false" ]; then
            run=true; publish=true
          else
            run=false; publish=false
          fi

          # Store uploads normally ride along with a new release, but an already
          # released tag can also be pushed to the stores after the fact by
          # dispatching with publish_stores=true (never while dry-running).
          if [ "$publish" = "true" ] || { [ "$stores_input" = "true" ] && [ "$dry" != "true" ]; }; then
            stores=true
          else
            stores=false
          fi

          # The store upload needs the packaged zips even when the release itself
          # is skipped because its tag already exists, so packaging follows either.
          if [ "$run" = "true" ] || [ "$stores" = "true" ]; then
            package=true
          else
            package=false
          fi

          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "run=$run"         >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "stores=$stores"   >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release $tag::run=$run publish=$publish stores=$stores package=$package (tag already exists: $tag_exists)"

      - name: Generate release notes from the commit log
        if: steps.ver.outputs.run == 'true'
        run: node scripts/release-notes.mjs

      - name: Download the extension artifacts
        if: steps.ver.outputs.package == 'true'
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Package the extension zips
        if: steps.ver.outputs.package == 'true'
        run: |
          set -euo pipefail
          (cd artifacts/keepass-cat-chrome && zip -qr "$GITHUB_WORKSPACE/keepass-cat-chrome.zip" .)
          (cd artifacts/keepass-cat-firefox && zip -qr "$GITHUB_WORKSPACE/keepass-cat-firefox.zip" .)

          # A store upload was once rejected with "Invalid file name in archive"
          # because the zip used backslash separators. Guard against that here.
          python3 - <<'PY'
          import zipfile

          for name in ("keepass-cat-chrome.zip", "keepass-cat-firefox.zip"):
              with zipfile.ZipFile(name) as zf:
                  entries = zf.namelist()
              backslashes = [e for e in entries if "\\" in e]
              at_root = "manifest.json" in entries
              print(f"{name}: entries={len(entries)} backslashes={len(backslashes)} manifest_at_root={at_root}")
              assert not backslashes, f"{name} has backslash entry names: {backslashes[:3]}"
              assert at_root, f"{name} has no manifest.json at its root"
          PY

          echo "── release body ──"
          cat RELEASE_BODY.md

      - name: Create the GitHub release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file RELEASE_BODY.md \
            --target "$GITHUB_SHA" \
            keepass-cat-chrome.zip keepass-cat-firefox.zip

      # ── Store uploads ──
      # Both steps below are best-effort: a store outage, a changed API or a slow
      # review must never fail a release that has already been created above.
      # Each one is a no-op (with a short message) until its secrets are set, and
      # checks that with a plain bash test because a missing `secrets.VALUE`
      # cannot be compared against '' in an `if:` expression.

      - name: Publish to Firefox (AMO)
        if: steps.ver.outputs.stores == 'true'
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] && [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "AMO_API_KEY / AMO_API_SECRET are not configured — skipping the Firefox store upload."
            exit 0
          fi

          # A listed AMO submission of a bundled/minified build must ship the
          # human-readable source too; Vite bundles and minifies, so this is
          # mandatory. `git archive` packages exactly the tree at HEAD.
          git archive --format=zip -o "$GITHUB_WORKSPACE/firefox-source.zip" HEAD

          # --approval-timeout 0 returns as soon as AMO accepts the submission.
          # Review of a listed add-on can take many hours, so waiting for it here
          # (the default is 15 minutes) would only ever time out and be pointless.
          npx --yes web-ext@10 sign \
            --source-dir artifacts/keepass-cat-firefox \
            --artifacts-dir "$GITHUB_WORKSPACE/web-ext-artifacts" \
            --channel listed \
            --upload-source-code "$GITHUB_WORKSPACE/firefox-source.zip" \
            --approval-timeout 0 \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

      - name: Publish to Chrome Web Store
        if: steps.ver.outputs.stores == 'true'
        continue-on-error: true
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -z "$CWS_SERVICE_ACCOUNT_JSON" ]; then
            echo "CWS_SERVICE_ACCOUNT_JSON is not configured — skipping the Chrome Web Store upload."
            exit 0
          fi

          node scripts/publish-cws.mjs keepass-cat-chrome.zip
